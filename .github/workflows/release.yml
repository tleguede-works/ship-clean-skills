name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      level:
        description: "Plancher de version à forcer (le niveau publié reste max(contenu, plancher))"
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

# Une seule release à la fois. Deux jobs de release concurrents se disputent le
# même numéro de version, et le perdant écrit un tag qui ne correspond plus à son
# contenu.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  verify:
    name: Vérifier
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      level: ${{ steps.decide.outputs.level }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Contrat du dépôt
        run: node scripts/validate-repo.js

      - name: Suite du skill forge
        run: node skills/forge/scripts/selftest.js

      - name: release.js en bac à sable
        run: node scripts/release-smoke.js

      # Construit l'archive et la revérifie **avant** de publier quoi que ce
      # soit. Une release dont l'archive ne reproduit pas la version est pire
      # qu'une release sans archive : elle affirme une reproductibilité fausse.
      - name: Snapshot — construction et vérification
        run: |
          set -euo pipefail
          node scripts/snapshot.js build --out dist --json | tee /tmp/snapshot.json
          node scripts/snapshot.js verify "dist/$(node -p "require('/tmp/snapshot.json').archive.split('/').pop()")" --against .

      - name: Cohérence VERSION ↔ CHANGELOG
        run: node scripts/release.js check

      # La décision vit dans `release.js`, pas dans ce workflow.
      #
      # Elle y était, en `node -e` échappé dans un heredoc, dupliquée trois fois,
      # donc testable seulement en publiant. Et `workflow_dispatch` court-circuitait
      # AVANT l'analyse : le niveau demandé était un plafond, alors que la
      # documentation annonçait un plancher. Une demande de `patch` sur une
      # section contenant un `feat` publiait un patch.
      - name: Décider s'il faut publier
        id: decide
        env:
          FORCE_LEVEL: ${{ inputs.level || '' }}
        run: |
          set -euo pipefail
          if [ -n "$FORCE_LEVEL" ]; then
            node scripts/release.js decide --force "$FORCE_LEVEL" | tee /tmp/decide.json
          else
            node scripts/release.js decide | tee /tmp/decide.json
          fi
          node -e "
            const fs = require('fs');
            const d = JSON.parse(fs.readFileSync('/tmp/decide.json', 'utf-8'));
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              'should_release=' + d.should_release + '\n' +
              'level=' + (d.level || '') + '\n' +
              'reason=' + String(d.reason).replace(/\n/g, ' ') + '\n');
          "

      - name: Résumé
        run: |
          {
            echo "### Décision de release"
            echo ""
            echo "- publier : \`${{ steps.decide.outputs.should_release }}\`"
            echo "- niveau   : \`${{ steps.decide.outputs.level || '—' }}\`"
            echo "- motif    : ${{ steps.decide.outputs.reason }}"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publier
    needs: verify
    if: needs.verify.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Reprise — tag existant sans release
        id: resume
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${{ needs.verify.outputs.should_release }}" ]; then :; fi
          tag=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -n "$tag" ] && git rev-parse "$tag" >/dev/null 2>&1; then
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "reprise=false" >> "$GITHUB_OUTPUT"
              echo "la release $tag existe déjà"
            else
              echo "reprise=true"  >> "$GITHUB_OUTPUT"
              echo "version=${{ needs.verify.outputs.level }}" >> /dev/null
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              echo "::warning::tag $tag présent sans release — publication reprise sans nouveau bump"
            fi
          else
            echo "reprise=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bumper la version et figer la section
        id: bump
        if: steps.resume.outputs.reprise != 'true'
        run: |
          set -euo pipefail
          node scripts/release.js bump --${{ needs.verify.outputs.level }} > /tmp/bump.json
          cat /tmp/bump.json

          # Le script écrit son JSON sur stdout. Sans cette recopie dans
          # GITHUB_OUTPUT, steps.bump.outputs.to reste VIDE en aval : le tag
          # devient « v », le message de commit devient vide, git refuse le
          # commit, et le « || exit 0 » masque l'échec. Le run rapportait alors
          # « success » après avoir publié une release vide.
          to=$(node -p "require('/tmp/bump.json').to")
          from=$(node -p "require('/tmp/bump.json').from")
          if [ -z "$to" ] || [ "$to" = "undefined" ]; then
            echo "::error::le bump n'a pas renvoyé de version — arrêt plutôt que de publier une release vide"
            exit 1
          fi
          echo "to=$to"   >> "$GITHUB_OUTPUT"
          echo "from=$from" >> "$GITHUB_OUTPUT"

      - name: Committer VERSION et CHANGELOG
        if: steps.resume.outputs.reprise != 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION CHANGELOG.md
          # --no-verify : ce commit est mécanique, il ne doit pas relancer la CI
          if git diff --cached --quiet; then
            echo "::error::VERSION et CHANGELOG n'ont pas changé après bump — arrêt"
            exit 1
          fi
          git commit -m "chore(release): ${{ steps.bump.outputs.to }}"
          git push

      # L'archive porte le CONTENU, pas les notes.
      #
      # Le skill n'est pas compilé : il n'y a aucun exécutable à produire. Sans
      # archive, une release ne permet pas de retrouver la version publiée — et
      # c'était le cas de toutes les releases précédentes, dont le seul asset
      # était le fichier de notes lui-même.
      - name: Construire le snapshot de la version publiée
        id: snapshot
        run: |
          set -euo pipefail
          if [ "${{ steps.resume.outputs.reprise }}" = "true" ]; then
            version="${{ steps.resume.outputs.tag }}"
            version="${version#v}"
          else
            version="${{ steps.bump.outputs.to }}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # L'archive doit reproduire l'état PUBLIÉ. En reprise, on se place sur
          # le commit du tag : c'est cet arbre-là qui a été publié.
          if [ "${{ steps.resume.outputs.reprise }}" = "true" ]; then
            git checkout -q "${{ steps.resume.outputs.tag }}"
          fi


          node scripts/snapshot.js build --version "$version" --out dist --json | tee /tmp/snapshot.json
          archive=$(node -p "require('/tmp/snapshot.json').archive")
          files=$(node -p "require('/tmp/snapshot.json').files")
          digest=$(node -p "require('/tmp/snapshot.json').content_sha256")
          echo "archive=$(basename "$archive")" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive"        >> "$GITHUB_OUTPUT"
          echo "files=$files"      >> "$GITHUB_OUTPUT"
          echo "digest=$digest"    >> "$GITHUB_OUTPUT"
          # Le manifeste sort du premier membre de l'archive : il est joint
          # séparément pour qu'on puisse le consulter SANS extraire 90 fichiers.
          mkdir -p dist/manifest
          tar -xzf "$archive" -C dist/manifest MANIFEST.json
          echo "manifest=dist/manifest/MANIFEST.json" >> "$GITHUB_OUTPUT"

      - name: Vérifier l'archive contre le commit publié
        run: |
          set -euo pipefail
          # Ce contrôle est la raison d'être du manifeste : il prouve que
          # l'archive qu'on va joindre reproduit bien l'état publié.
          node scripts/snapshot.js verify "${{ steps.snapshot.outputs.archive_path }}" --against .

      - name: Créer la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "${{ steps.resume.outputs.tag || format('v{0}', steps.bump.outputs.to) }}"
          VERSION: "${{ steps.snapshot.outputs.version }}"
          ARCHIVE: "${{ steps.snapshot.outputs.archive_path }}"
          MANIFEST: "${{ steps.snapshot.outputs.manifest }}"
          FILES: "${{ steps.snapshot.outputs.files }}"
          DIGEST: "${{ steps.snapshot.outputs.digest }}"
        run: |
          set -euo pipefail
          # Les notes viennent de release.js, pas d'une regex écrite ici.
          NOTES=$(node scripts/release.js notes "$VERSION")

          # Dernier rempart. Une release avec un tag non sémantique, des notes
          # vides, une VERSION qui ne correspond pas, ou une archive absente,
          # est exactement le « mécanisme arbitraire » à éviter.
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag « $TAG » non sémantique — refus de publier"
            exit 1
          fi
          if [ -z "$(cat VERSION)" ] || [ "$(cat VERSION)" != "$VERSION" ]; then
            echo "::error::VERSION ($(cat VERSION)) ne correspond pas à la version publiée $VERSION"
            exit 1
          fi
          if [ -z "$NOTES" ]; then
            echo "::error::notes de release vides pour $TAG — la section CHANGELOG correspondante est vide ou introuvable"
            exit 1
          fi
          if [ ! -f "$ARCHIVE" ] || [ ! -f "$MANIFEST" ]; then
            echo "::error::archive ou manifeste absent : une release sans snapshot ne reproduit pas la version publiée"
            exit 1
          fi

          {
            echo "## $VERSION"
            echo ""
            echo "$(date -u +%Y-%m-%d)"
            echo ""
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "### Snapshot"
            echo ""
            echo "Le skill n'est pas compilé : **l'archive jointe EST la version publiée**."
            echo "Elle contient l'intégralité du skill, et \`MANIFEST.json\` en premier"
            echo "membre — SHA-256 de chaque fichier, version, commit publié."
            echo ""
            echo "- archive : \`$(basename "$ARCHIVE")\`"
            echo "- manifeste : \`$(basename "$MANIFEST")\`"
            echo "- fichiers : $FILES"
            echo "- empreinte du contenu : \`$DIGEST\`"
            echo ""
            echo "Vérifier l'archive sans le dépôt :"
            echo ""
            echo '```bash'
            echo "tar -xzf $(basename "$ARCHIVE")"
            echo "node -e \"const m=require('./MANIFEST.json');console.log(m.version, m.commit, m.file_count)\""
            echo '```'
            echo ""
            echo "Installer : \`npx skills add tleguede-works/ship-clean-skills --skill <nom> -g -a opencode\`"
          } > /tmp/notes.md

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "le tag $TAG existe deja — on ne le recree pas"
          else
            git tag -a "$TAG" -m "release $VERSION"
            git push origin "$TAG"
          fi

          # Si la release existe deja, il n'y a rien a recreer. Sortir en 0
          # ici est correct : l'etat demande EST atteint. C'est different du cas
          # « tag sans release », ou sortir en 0 transformait une panne en etat
          # permanent.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "la release $TAG existe deja — rien a publier"
            exit 0
          fi

          # Les assets sont des CHEMINS, jamais une liste reconstruite par
          # découpage de mots.
          #
          # La première version reconstruisait la liste d'assets par
          # word-splitting puis expansion de motifs, à partir d'un fichier.
          # Sur le runner, un élément a ete interprete comme un motif non
          # appari : le job est mort ENTRE la creation du tag et celle de la
          # release — l'etat exact decrit en tete de ce fichier.
          # Un chemin est passe comme chemin, entre guillemets, sans detour.
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            "$MANIFEST" \
            "$ARCHIVE"

      - name: Re-télécharger la release et vérifier son contenu
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: "${{ steps.resume.outputs.tag || format('v{0}', steps.bump.outputs.to) }}"
          VERSION: "${{ steps.snapshot.outputs.version }}"
          ARCHIVE_NAME: "${{ steps.snapshot.outputs.archive }}"
        run: |
          set -euo pipefail
          # On ne fait pas confiance à ce qu'on vient d'envoyer. On relit la
          # release depuis l'API, on télécharge les assets, on extrait, et on
          # compare au commit publié. C'est la seule vérification qui prouve que
          # la release, telle qu'un utilisateur la trouvera, est exploitable.
          rm -rf /tmp/relcheck && mkdir -p /tmp/relcheck/x
          gh release download "$TAG" \
            --dir /tmp/relcheck \
            --pattern "$ARCHIVE_NAME" \
            --repo "$GITHUB_REPOSITORY"

          test -f "/tmp/relcheck/$ARCHIVE_NAME" \
            || { echo "::error::l'archive publiée est introuvable : $ARCHIVE_NAME"; exit 1; }

          tar -xzf "/tmp/relcheck/$ARCHIVE_NAME" -C /tmp/relcheck/x

          test -f /tmp/relcheck/x/MANIFEST.json \
            || { echo "::error::MANIFEST.json absent de l'archive publiee"; exit 1; }
          test -f /tmp/relcheck/x/skills/forge/SKILL.md \
            || { echo "::error::le skill forge est absent de l'archive publiee"; exit 1; }
          test -f /tmp/relcheck/x/skills/forge/scripts/state.js \
            || { echo "::error::les scripts du skill sont absents de l'archive publiee"; exit 1; }

          # Le manifeste doit aussi etre joint SEUL : c'est ce qu'on consulte
          # pour verifier sans extraire 90 fichiers.
          gh release download "$TAG" \
            --dir /tmp/relcheck \
            --pattern 'MANIFEST.json' \
            --repo "$GITHUB_REPOSITORY" || true

          node -e "
            const m = require('/tmp/relcheck/x/MANIFEST.json');
            if (m.version !== process.argv[1]) {
              console.error('version de l\\'archive : ' + m.version + ', attendu ' + process.argv[1]);
              process.exit(1);
            }
            console.log('archive publiee : ' + m.version + ' — ' + m.file_count + ' fichiers, commit ' + m.commit);
          " "$VERSION"

          # Et on revalide chaque fichier contre son empreinte : c'est ce que
          # fera l'utilisateur qui depose une reclamation.
          node scripts/snapshot.js verify "/tmp/relcheck/$ARCHIVE_NAME" --against /tmp/relcheck/x

          echo "::notice::release $TAG verifiee par re-telechargement et extraction"
