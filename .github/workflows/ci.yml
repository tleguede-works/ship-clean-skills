name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Le dépôt lui-même : contrats de skills, références croisées, listes
      # déclarées vs fichiers réels, placeholders non rendus, syntaxe.
      - name: Validate repository
        run: node scripts/validate-repo.js

      # Forge a sa propre suite : c'est un skill exécutable, pas de la prose.
      - name: Forge selftest
        run: node skills/forge/scripts/selftest.js

      # VERSION et CHANGELOG doivent raconter la même chose. Une divergence ici
      # signifie qu'une version a été publiée sans être décrite, ou décrite
      # sans être publiée.
      - name: VERSION ↔ CHANGELOG
        run: node scripts/release.js check

      # release.js est exécuté pour de vrai, dans une copie jetable. Une
      # régression qui ferait publier une release vide ne serait visible
      # qu'au moment de publier.
      - name: release.js en bac à sable
        run: node scripts/release-smoke.js

      # L'archive de release est construite, vérifiée contre le checkout, puis
      # vérifiée APRÈS altération. Un contrôle qui ne peut pas échouer ne prouve
      # rien : c'est le test négatif qui distingue une archive vérifiée d'une
      # archive simplement absente.
      - name: Snapshot de release en bac à sable
        run: node scripts/snapshot-smoke.js

      # Le workflow de release commite VERSION et CHANGELOG sur main. Sans
      # cette règle, la prochaine pull request qui touche ces deux fichiers
      # entre en conflit — et le conflit s'installe au pire moment, entre deux
      # versions publiées.
      #
      # `--base main` n'est pas facultatif. Sans lui, le script ne vérifie que
      # la FORME du fichier ; les deux contrôles qui portent le sens — la partie
      # publiée n'a pas été réécrite, et `[Unreleased]` a vraiment été modifié —
      # n'existent pas. La forme seule laisse passer une pull request qui
      # n'ajoute aucune trace, ce qui est précisément ce que la règle interdit.
      - name: Politique CHANGELOG
        run: node scripts/changelog-policy.js --base main

  workflows:
    name: Syntaxe des workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Une action de release mal écrite ne se voit qu'au moment de publier,
      # c'est-à-dire quand c'est le plus coûteux.
      - name: Valider le YAML et le bash de chaque workflow
        run: |
          for f in .github/workflows/*.yml; do
            echo "-- $f"
            python3 -c "import yaml; yaml.safe_load(open('$f')); print('   YAML valide')"
          done

      # Un `run:` qui n'est pas du bash valide passe la contrôle YAML, puis meurt
      # SUR LE RUNNER — après avoir poussé le tag et commité VERSION/CHANGELOG.
      # C'est-à-dire qu'il a déjà modifié l'état du dépôt quand il s'arrête.
      # Constaté en conditions réelles : le job de release est mort entre
      # `git push origin "$TAG"` et `gh release create`, laissant un tag orphelin
      # et aucune release. Ce contrôle déplace l'échec avant la publication.
      - name: Chaque bloc "run" est du bash valide
        run: python3 scripts/check-workflows.py
